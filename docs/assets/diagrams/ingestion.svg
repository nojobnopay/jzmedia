<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">让第一部内容进入媒体库</title><desc id="desc">确认视频库后，服务器已有文件选择扫描，当前设备文件选择上传；剧集自动补齐资料，有整理项时汇总预览，确认后执行移动和改名。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8f9bab"/></marker></defs>
<rect width="1000" height="510" rx="22" fill="#f6f8fb"/>
<g font-family="system-ui, Noto Sans CJK SC, sans-serif">
<text x="36" y="52" font-size="28" fill="#172236" font-weight="700">让第一部内容进入媒体库</text><rect x="35" y="100" width="265" height="125" rx="18" fill="#fff" stroke="#d8dfe8"/><rect x="35" y="120" width="5" height="85" rx="2" fill="#c43b4c"/><text x="59" y="139" font-size="23" fill="#172236" font-weight="700">1  确认视频库</text><text x="59" y="176" font-size="18" fill="#354153" font-weight="400">检查目录连接与内容类型</text><path d="M302 163 L355 163" fill="none" stroke="#8f9bab" stroke-width="3" marker-end="url(#arrow)"/><rect x="375" y="100" width="270" height="125" rx="18" fill="#fff" stroke="#d8dfe8"/><rect x="375" y="120" width="5" height="85" rx="2" fill="#c43b4c"/><text x="399" y="139" font-size="23" fill="#172236" font-weight="700">2  添加内容</text><text x="399" y="176" font-size="18" fill="#354153" font-weight="400">服务器已有 → 扫描</text><rect x="375" y="245" width="270" height="125" rx="18" fill="#fff" stroke="#d8dfe8"/><rect x="375" y="265" width="5" height="85" rx="2" fill="#267b76"/><text x="399" y="284" font-size="23" fill="#172236" font-weight="700">或：从设备上传</text><text x="399" y="321" font-size="18" fill="#354153" font-weight="400">选择文件或文件夹</text><path d="M300 175 L355 310" fill="none" stroke="#8f9bab" stroke-width="3" marker-end="url(#arrow)"/><path d="M647 160 L705 160" fill="none" stroke="#8f9bab" stroke-width="3" marker-end="url(#arrow)"/><path d="M647 309 L705 175" fill="none" stroke="#8f9bab" stroke-width="3" marker-end="url(#arrow)"/><rect x="725" y="100" width="240" height="170" rx="18" fill="#fff" stroke="#d8dfe8"/><rect x="725" y="120" width="5" height="130" rx="2" fill="#c43b4c"/><text x="749" y="139" font-size="23" fill="#172236" font-weight="700">3  核对并播放</text><text x="749" y="176" font-size="18" fill="#354153" font-weight="400">检查标题与待办</text><text x="749" y="204" font-size="18" fill="#354153" font-weight="400">打开详情开始播放</text><text x="38" y="418" font-size="23" fill="#172236" font-weight="600">剧集自动补资料；有整理项时汇总预览，确认后执行。</text><text x="38" y="454" font-size="19" fill="#354153" font-weight="400">可稍后处理或忽略本次；电影整理仍从对应工具预览。</text></g></svg>
