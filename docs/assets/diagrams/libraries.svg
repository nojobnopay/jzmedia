<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">先连接存储，再划分电影和剧集</title><desc id="desc">媒体库保存本地、SMB 或 NFS 的存储连接；视频库选择媒体库中的子目录和电影或剧集类型。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8f9bab"/></marker></defs>
<rect width="1000" height="510" rx="22" fill="#f6f8fb"/>
<g font-family="system-ui, Noto Sans CJK SC, sans-serif">
<text x="36" y="52" font-size="28" fill="#172236" font-weight="700">先连接存储，再划分电影和剧集</text><rect x="40" y="110" width="390" height="186" rx="18" fill="#fff" stroke="#d8dfe8"/><rect x="40" y="130" width="5" height="146" rx="2" fill="#c43b4c"/><text x="64" y="149" font-size="23" fill="#172236" font-weight="700">① 媒体库 · 文件在哪里</text><text x="64" y="186" font-size="18" fill="#354153" font-weight="400">示例：家里的 NAS</text><text x="64" y="214" font-size="18" fill="#354153" font-weight="400">连接类型：本地 / SMB / NFS</text><text x="64" y="242" font-size="18" fill="#354153" font-weight="400">连接、地址和账号在这里设置</text><path d="M432 160 L535 160" fill="none" stroke="#8f9bab" stroke-width="3" marker-end="url(#arrow)"/><path d="M432 250 L535 325" fill="none" stroke="#8f9bab" stroke-width="3" marker-end="url(#arrow)"/><rect x="555" y="105" width="405" height="150" rx="18" fill="#fff" stroke="#d8dfe8"/><rect x="555" y="125" width="5" height="110" rx="2" fill="#c43b4c"/><text x="579" y="144" font-size="23" fill="#172236" font-weight="700">② 视频库 · 电影</text><text x="579" y="181" font-size="18" fill="#354153" font-weight="400">子目录：电影/</text><text x="579" y="209" font-size="18" fill="#354153" font-weight="400">按电影方式扫描、观看和整理</text><rect x="555" y="285" width="405" height="150" rx="18" fill="#fff" stroke="#d8dfe8"/><rect x="555" y="305" width="5" height="110" rx="2" fill="#267b76"/><text x="579" y="324" font-size="23" fill="#172236" font-weight="700">② 视频库 · 剧集</text><text x="579" y="361" font-size="18" fill="#354153" font-weight="400">子目录：剧集/</text><text x="579" y="389" font-size="18" fill="#354153" font-weight="400">按剧、季、集组织内容</text><text x="42" y="363" font-size="21" fill="#172236" font-weight="600">一个媒体库可以包含多个视频库。</text><text x="42" y="399" font-size="18" fill="#354153" font-weight="400">扫描、上传和整理时，请先确认目标视频库。</text></g></svg>
