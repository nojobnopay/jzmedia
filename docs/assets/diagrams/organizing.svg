<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">整理之前，先核对每一条路径</title><desc id="desc">整理预览显示原目录与目标目录；确认后才执行移动和改名。正片与同茎字幕跟随，已存在的目标文件不覆盖。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8f9bab"/></marker></defs>
<rect width="1000" height="510" rx="22" fill="#f6f8fb"/>
<g font-family="system-ui, Noto Sans CJK SC, sans-serif">
<text x="36" y="52" font-size="28" fill="#172236" font-weight="700">整理之前，先核对每一条路径</text><rect x="38" y="108" width="405" height="232" rx="18" fill="#fff" stroke="#d8dfe8"/><rect x="38" y="128" width="5" height="192" rx="2" fill="#c43b4c"/><text x="62" y="147" font-size="23" fill="#172236" font-weight="700">整理前 · 示例</text><text x="62" y="184" font-size="18" fill="#354153" font-weight="400">待归档演示/</text><text x="62" y="212" font-size="18" fill="#354153" font-weight="400">  Star.Voyage.2026.mp4</text><text x="62" y="240" font-size="18" fill="#354153" font-weight="400">  Star.Voyage.2026.chs.srt</text><text x="62" y="268" font-size="18" fill="#354153" font-weight="400">  movie.nfo</text><path d="M450 222 L527 222" fill="none" stroke="#8f9bab" stroke-width="3" marker-end="url(#arrow)"/><rect x="550" y="108" width="410" height="232" rx="18" fill="#fff" stroke="#d8dfe8"/><rect x="550" y="128" width="5" height="192" rx="2" fill="#267b76"/><text x="574" y="147" font-size="23" fill="#172236" font-weight="700">整理后 · 示例</text><text x="574" y="184" font-size="18" fill="#354153" font-weight="400">待归档演示/星海漫游 (2026)/</text><text x="574" y="212" font-size="18" fill="#354153" font-weight="400">  星海漫游 (2026).mp4</text><text x="574" y="240" font-size="18" fill="#354153" font-weight="400">  星海漫游 (2026).chs.srt</text><text x="574" y="268" font-size="18" fill="#354153" font-weight="400">  movie.nfo</text><text x="42" y="396" font-size="24" fill="#172236" font-weight="600">预览 → 核对目标 → 勾选项目 → 确认执行 → 检查结果</text><text x="42" y="439" font-size="19" fill="#354153" font-weight="400">实际名称以应用预览为准；目标冲突不覆盖，需要撤回时使用还原位置。</text></g></svg>
