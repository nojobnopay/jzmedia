services:
  mymedia:
    build:
      context: .
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTP_PROXY:-}
        http_proxy: ${BUILD_HTTP_PROXY:-}
        https_proxy: ${BUILD_HTTP_PROXY:-}
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: jzmedia:${APP_VERSION:-latest}
    # 以宿主 UID/GID 运行（评审 P1-09）：容器建的文件（NFO/海报/转码产物）宿主可直接管理。
    # 缺省 0:0 保持旧的 root 行为；可直接修改 user，或在可选 .env 填 UID/GID。
    # 用 `id -u`/`id -g` 核对宿主用户，并确保数据目录可写（见部署教程）。
    user: "${UID:-0}:${GID:-0}"
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      # Compose >= 2.24.0：已有配置继续读取；文件不存在时跳过，不自动创建。
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MEDIA_ROOT: /app/media
      DATA_DIR: /app/data
    volumes:
      - "${MEDIA_HOST_PATH:-./media}:/app/media:rw"
      - "${DATA_HOST_PATH:-./data}:/app/data"
    # Intel 硬件转码：在宿主 stat -c '%g' /dev/dri/renderD128 核对实际组号后启用。
    # 仅映射 render 节点，无需 privileged 或修改宿主设备权限。
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # group_add:
    #   - "${RENDER_GID}"
    # NVIDIA NVENC：按 docs/getting-started/configuration.md 叠加 compose.nvidia.yml。
    # 应用内挂载 SMB/NFS 远程库（C 阶段）：需要 CAP_SYS_ADMIN（容器内 mount）。
    # DSM/群晖 的 AppArmor 可能仍拦截，必要时改用 privileged: true；不需要应用内挂载
    # （宿主挂载后登记为 local 路径）时保持注释即可。
    # cap_add:
    #   - SYS_ADMIN
    restart: unless-stopped
    # tini 作为 PID 1：转发信号、回收 ffmpeg 等子进程僵尸（评审 R01-Q3）
    init: true
    # 编排级探活：健康接口自检 DB/媒体根（镜像无 curl，用自带 python）
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
