services:
  mymedia:
    build:
      context: .
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTP_PROXY:-}
        http_proxy: ${BUILD_HTTP_PROXY:-}
        https_proxy: ${BUILD_HTTP_PROXY:-}
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: jzmedia:${APP_VERSION:-latest}
    # 以宿主 UID/GID 运行（评审 P1-09）：容器建的文件（NFO/海报/转码产物）宿主可直接管理。
    # 缺省 0:0 保持旧的 root 行为；NAS/WSL 都应在 .env 填 `id -u`/`id -g`
    # （NAS 另需保证 DATA_HOST_PATH 属主为该用户，见 README 部署说明）。
    user: "${UID:-0}:${GID:-0}"
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      MEDIA_ROOT: /media
      DATA_DIR: /app/data
    volumes:
      - "${MEDIA_HOST_PATH:-./sample_media}:/media:rw"
      - "${DATA_HOST_PATH:-./data}:/app/data"
    # NAS 硬件转码（Intel QSV/VAAPI：DS425+ 等）：取消下面注释并在 .env 填宿主 gid
    # （DSM 上 `stat -c '%g' /dev/dri/renderD128` 取 render 组 id，通常 109；video 组 44）
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${VIDEO_GID:-44}"
    #   - "${RENDER_GID:-109}"
    # 应用内挂载 SMB/NFS 远程库（C 阶段）：需要 CAP_SYS_ADMIN（容器内 mount）。
    # DSM/群晖 的 AppArmor 可能仍拦截，必要时改用 privileged: true；不需要应用内挂载
    # （宿主挂载后登记为 local 路径）时保持注释即可。
    # cap_add:
    #   - SYS_ADMIN
    restart: unless-stopped
    # tini 作为 PID 1：转发信号、回收 ffmpeg 等子进程僵尸（评审 R01-Q3）
    init: true
    # 编排级探活：健康接口自检 DB/媒体根（镜像无 curl，用自带 python）
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
