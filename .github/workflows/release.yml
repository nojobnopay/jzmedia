name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Validate cloud build' || github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

# Serialize complete releases so an older run cannot move latest backwards.
concurrency:
  group: jzmedia-release
  queue: max
  cancel-in-progress: false

env:
  JZMEDIA_ANDROID_DEBUG_CERT_SHA256: ${{ vars.JZMEDIA_ANDROID_DEBUG_CERT_SHA256 }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # GitHub only exposes draft releases to callers with push access.
    outputs:
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_release.py preflight

  build:
    needs: prepare
    if: needs.prepare.outputs.mode != 'complete'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      bundle_name: release-bundle-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Restore and verify stable APK signing key
        env:
          JZMEDIA_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.JZMEDIA_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: python scripts/github_signing.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '25'
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          android_sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$android_sdk_manager" ]; then
            android_sdk_managers=("$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager)
            android_sdk_manager="${android_sdk_managers[0]}"
          fi
          "$android_sdk_manager" 'platforms;android-36' 'build-tools;36.0.0'
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Validate and build both artifacts
        env:
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
        run: |
          if [ "$RELEASE_MODE" = 'validate' ]; then
            .venv/bin/python scripts/release.py build --validate-only
          else
            .venv/bin/python scripts/release.py build
          fi
      - name: Package verified release bundle
        if: needs.prepare.outputs.mode == 'build'
        run: .venv/bin/python scripts/github_release.py package
      - name: Preserve exact artifacts for the publication job and retries
        if: needs.prepare.outputs.mode == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.run_attempt }}
          path: output/github-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save build diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-logs-${{ github.run_attempt }}
          path: output/**/logs/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove runner signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

  publish:
    if: needs.prepare.outputs.mode == 'build' && github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.bundle_name }}
          path: output/github-release
      - name: Publish verified bundle to GHCR and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_release.py publish
